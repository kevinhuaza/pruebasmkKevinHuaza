# Stack separado, solo para analisis de calidad local con SonarQube.
# Uso: docker compose -f docker-compose.sonar.yml up -d
# UI disponible en http://localhost:9000 (usuario/clave iniciales: admin/admin)
services:
  sonarqube:
    image: sonarqube:community
    restart: unless-stopped
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs

volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
